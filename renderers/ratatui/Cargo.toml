[package]
name = "neo-renderer-ratatui"
description = "ratatui renderer for neo's resolved view format: chat items as styled lines"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
ratatui = { version = "0.30", default-features = false }
serde_json = "1"
neo-protocol = { path = "../../protocol/rust" }
unicode-width = "0.2"
devicons = "0.6"
syntect = { version = "5", default-features = false, features = ["parsing", "regex-onig"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-onig"] }
