[package]
name = "suite-renderer-gpui"
description = "GPUI renderer for the suite's resolved view format (chat items, theme tokens)"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
gpui = "0.2.2"
serde_json = "1"
suite-protocol = { path = "../../protocol/rust" }
suite-sdk = { path = "../../sdk-rs" }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
