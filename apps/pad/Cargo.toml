[package]
name = "suite-pad"
description = "Pad: a small GPUI app that stands in for the code editor (Grove): files, diagnostics, tools and the agent's chat pane"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "suite-pad"
path = "src/main.rs"

[dependencies]
async-channel = "2"
gpui = "0.2.2"
serde_json = "1"
suite-protocol = { path = "../../protocol/rust" }
suite-renderer-gpui = { path = "../../renderers/gpui" }
suite-sdk = { path = "../../sdk-rs" }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
