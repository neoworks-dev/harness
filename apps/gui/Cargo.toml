[package]
name = "neo-gui"
description = "Neo's desktop app: the shared conversation in a native window, drawn by svelte-gpui"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "neo-gui"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
neo-github = { path = "../../crates/github" }
neo-mention = { path = "../../crates/mention" }
neo-sdk = { path = "../../sdk-rs" }
# svelte-gpui is checked out next to this repo.
# TEMPORARY: the web-target worktree has the browser target (`serve`). When that branch is merged,
# this goes back to "../../../svelte-gpui/host".
svelte_gpui_host = { path = "../../../svelte-gpui/.worktrees/web-target/host" }

[dev-dependencies]
neo-github = { path = "../../crates/github", features = ["fixtures"] }
