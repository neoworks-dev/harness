[package]
name = "neo-term"
description = "Neo's full-screen terminal app: the shared conversation, plan, files and usage"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "neo-term"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ratatui = { version = "0.30", features = ["crossterm"] }
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
serde_json = "1"
neo-github = { path = "../../crates/github" }
neo-protocol = { path = "../../protocol/rust" }
neo-renderer-ratatui = { path = "../../renderers/ratatui" }
neo-sdk = { path = "../../sdk-rs" }
unicode-width = "0.2"
zeroize = "1"

[dev-dependencies]
neo-github = { path = "../../crates/github", features = ["fixtures"] }
