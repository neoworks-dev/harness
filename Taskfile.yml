# Every build, lint and test task, plus the dev loops. `task --list` shows them all; `task check` builds,
# lints and tests everything. On Arch the binary is `go-task`.
version: "3"

vars:
  GO_MODULES: apps/cli sdk-go renderers/tui protocol/go
  # Named, so rustfmt leaves path dependencies outside this repo (svelte-gpui's host) alone.
  RUST_PACKAGES: -p neo-protocol -p neo-sdk -p neo-renderer-gpui -p neo-renderer-ratatui -p neo-term -p neo-gui -p neo-github

tasks:
  default:
    cmds:
      - "{{.TASK_EXE}} --list"

  check:
    desc: Install, check codegen and formatting, lint, typecheck, build and test everything
    cmds:
      - task: install
      - task: codegen:check
      - task: format:check
      - task: lint
      - task: typecheck
      - task: build
      - task: test

  install:
    desc: Install the JS dependencies from the lockfile
    cmds:
      - bun install --frozen-lockfile

  # Building

  build:
    desc: Build every binary into bin/
    cmds:
      - task: build:neo
      - task: build:term
      - task: build:gui

  build:neo:
    desc: The CLI and daemon launcher (bin/neo)
    cmds:
      - go build -o bin/neo ./apps/cli

  build:term:
    desc: The terminal app (bin/neo-term), what `neo` with no arguments opens
    cmds:
      - cargo build --release -p neo-term
      - cp target/release/neo-term bin/neo-term.tmp && mv bin/neo-term.tmp bin/neo-term

  build:gui:
    desc: The desktop app (bin/neo-gui) and its UI bundle
    summary: Needs svelte-gpui and extension-system (built with `bun run build`) checked out next to this repo.
    cmds:
      - task: gui:bundle
      - cargo build --release -p neo-gui
      - cp target/release/neo-gui bin/neo-gui.tmp && mv bin/neo-gui.tmp bin/neo-gui

  gui:bundle:
    desc: Bundle the desktop app's Svelte UI (apps/gui/dist/gui.js)
    cmds:
      - bun apps/gui/build.mjs

  # Running

  up:
    desc: Make sure the daemon is running
    deps: [build:neo]
    cmds:
      - bin/neo up

  down:
    desc: Stop the daemon
    cmds:
      - bin/neo down

  daemon:
    desc: Run the daemon in the foreground
    cmds:
      - bun run daemon/src/main.ts

  gui:
    desc: Open the desktop app the way users do (`neo gui`), after building it
    deps: [build:neo, build:gui]
    cmds:
      - bin/neo gui {{.CLI_ARGS}}

  gui:dev:
    desc: The desktop app with hot reload; a saved .svelte or .ts file updates the open window
    summary: |
      Watches and rebundles the UI, and runs a window that reloads when the bundle changes.
      Rust changes (apps/gui/src) still need a restart of this task. Pick the session with
      NEO_GUI_SESSION=<id> or NEO_GUI_NEW=1.
    deps: [up]
    cmds:
      - cargo build --release -p neo-gui
      - task: gui:bundle
      - |
        bun apps/gui/build.mjs --watch &
        watcher=$!
        trap 'kill $watcher 2>/dev/null' EXIT
        target/release/neo-gui --bundle apps/gui/dist/gui.js --watch

  gui:shot:
    desc: "Screenshot the desktop app headless, e.g. `task gui:shot -- /tmp/gui.png 4` (SCENE, SEED: see apps/gui/scripts/shot.sh)"
    cmds:
      - apps/gui/scripts/shot.sh {{.CLI_ARGS}}

  term:
    desc: Open the terminal app, after building it
    deps: [build:neo, build:term]
    cmds:
      - bin/neo

  # Testing and linting

  test:
    desc: Run the TS, Go and Rust tests
    cmds:
      - task: test:ts
      - task: test:go
      - task: test:rust

  test:ts:
    cmds:
      - bun test

  test:go:
    cmds:
      - for: { var: GO_MODULES, split: " " }
        cmd: echo "go test {{.ITEM}}" && go -C {{.ITEM}} test ./...

  test:rust:
    cmds:
      - cargo test --workspace --quiet

  lint:
    desc: Lint TS, Go and Rust
    cmds:
      - task: lint:ts
      - task: lint:go
      - task: lint:rust

  lint:ts:
    cmds:
      - bunx oxlint --type-aware --deny-warnings

  lint:go:
    cmds:
      - out=$(gofmt -l {{.GO_MODULES}}); if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - for: { var: GO_MODULES, split: " " }
        cmd: go -C {{.ITEM}} vet ./...

  lint:rust:
    cmds:
      - cargo fmt {{.RUST_PACKAGES}} --check
      - cargo clippy --workspace --all-targets --quiet -- -D warnings

  typecheck:
    desc: Typecheck the TS workspace and the desktop app's Svelte
    cmds:
      - bunx tsc -p tsconfig.json --noEmit
      - cd apps/gui && bunx svelte-check --tsconfig ./tsconfig.json --fail-on-warnings

  format:
    desc: Format TS, Go and Rust in place
    cmds:
      - bunx prettier --write .
      - gofmt -w {{.GO_MODULES}}
      - cargo fmt {{.RUST_PACKAGES}}

  format:check:
    cmds:
      - bunx prettier --check .

  # Generated code

  codegen:
    desc: Regenerate protocol types from the JSON Schemas and resolve fixtures (checked in)
    cmds:
      - bun run protocol/codegen/main.ts
      - bun run daemon/scripts/fixtures.ts

  codegen:check:
    desc: Fail if the checked-in generated types are stale
    cmds:
      - bun run protocol/codegen/main.ts --check
      - bun run daemon/scripts/fixtures.ts --check
